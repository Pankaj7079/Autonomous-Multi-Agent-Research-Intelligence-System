# Local dev services only. Cloud mode runs without any of this —
#   docker compose up -d                      redis + qdrant
# Tracing needs no container: langsmith is hosted and reads LANGSMITH_* from .env (ADR-046)

services:
  redis:
    image: redis:7-alpine
    container_name: amaris-redis
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: amaris-qdrant
    ports: ["6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]
    # qdrant's image has no shell, so the usual curl healthcheck fails —
    # readiness is checked by the app's /ready probe instead
    restart: unless-stopped

volumes:
  qdrant_data:
