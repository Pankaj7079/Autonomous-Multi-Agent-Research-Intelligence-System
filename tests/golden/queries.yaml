# AMARIS golden set — run by amaris.evaluation.harness against the full live pipeline.
# 20 queries, 8 categories.
#
# An eval set where everything passes measures nothing, so six of these (r1, r2, a1, a2, a3, m2)
# are deliberately hard: recent or fast-moving facts, or genuinely unresolvable questions, where
# a mediocre score is the CORRECT outcome and not a bug.
#
# Four categories check the opposite failure — spending a full research run on a question that
# did not need one. direct, clarification and live all expect FEWER agents, not more, and they
# use forbidden_agents to say so, because "the analyst never ran" is the actual assertion and
# expected_agents_involved can only check presence.
#
# Fields:
#   expected_depth          acceptable triage sizings. A set, not one value — triage is an LLM
#                           call and a question can reasonably size two ways. Empty = don't care.
#   expected_min_sources    floor, not a target. Budgets: direct 6, brief 8, standard 12, deep 20.
#   expected_agents_involved  must all appear in agent_path.
#   forbidden_agents        must NOT appear in agent_path.
#   reference_answer        optional. Only queries that set it get context_recall scored, so it
#                           is set only where the answer is stable enough to stay true.

# ── direct — one settled fact, answered short. The analyst must never run (analysis=False). ──

- id: d1
  query: "Who created the Python programming language?"
  category: direct
  expected_depth: [direct]
  expected_min_sources: 1
  expected_agents_involved: [triage, planner, researcher, writer, critic]
  forbidden_agents: [analyst, clarify, live]
  should_require_revision: false
  reference_answer: "Guido van Rossum created Python, first released in 1991."
  notes: "one settled fact — must triage as direct, skip the analyst, and answer in a couple of sentences rather than a six-section report"

- id: d2
  query: "What does the acronym MCP stand for?"
  category: direct
  expected_depth: [direct]
  expected_min_sources: 1
  expected_agents_involved: [triage, planner, researcher, writer, critic]
  forbidden_agents: [analyst, clarify, live]
  should_require_revision: false
  reference_answer: "MCP stands for Model Context Protocol, an open standard from Anthropic for connecting LLM applications to external tools and data sources."
  notes: "a definition, not a research question — the point is that it costs one task and one search"

# ── factual — the ordinary path, and the baseline every other category is read against. ──

- id: f1
  query: "What is the Model Context Protocol (MCP)?"
  category: factual
  expected_depth: [brief, standard]
  expected_min_sources: 4
  expected_agents_involved: [triage, planner, researcher, writer, critic]
  forbidden_agents: [clarify, live]
  should_require_revision: false
  notes: "well-documented topic, should converge fast with high research_quality"

- id: f2
  query: "What is LangGraph and who built it?"
  category: factual
  expected_depth: [brief, standard]
  expected_min_sources: 4
  expected_agents_involved: [triage, planner, researcher, writer, critic]
  forbidden_agents: [clarify, live]
  should_require_revision: false
  reference_answer: "LangGraph is an open-source framework from LangChain for building stateful, graph-structured multi-agent and agentic LLM applications."
  notes: "single clear answer, and the reference makes this the query context_recall is actually scored on"

- id: f3
  query: "What is Retrieval-Augmented Generation (RAG)?"
  category: factual
  expected_depth: [brief, standard]
  expected_min_sources: 4
  expected_agents_involved: [triage, planner, researcher, writer, critic]
  forbidden_agents: [clarify, live]
  should_require_revision: false
  notes: "core concept for this project, easy to fact-check the report against"

# ── comparative — two sides, and the failure mode is researching only one of them. ──

- id: c1
  query: "Compare LangGraph and CrewAI for building multi-agent systems"
  category: comparative
  expected_depth: [standard, deep]
  expected_min_sources: 6
  expected_agents_involved: [triage, planner, researcher, analyst, writer, critic]
  forbidden_agents: [clarify, live]
  should_require_revision: false
  notes: "needs balanced sourcing on both sides — watch for one-sided research in raw_research"

- id: c2
  query: "Compare Groq and OpenAI for LLM inference speed and cost"
  category: comparative
  expected_depth: [standard, deep]
  expected_min_sources: 5
  expected_agents_involved: [triage, planner, researcher, analyst, writer, critic]
  forbidden_agents: [clarify, live]
  should_require_revision: false
  notes: "numeric claims — this is the query where the citation audit should have the most figures to check against stored page text"

- id: c3
  query: "Compare REST APIs and GraphQL for a research backend"
  category: comparative
  expected_depth: [standard, deep]
  expected_min_sources: 5
  expected_agents_involved: [triage, planner, researcher, analyst, writer, critic]
  forbidden_agents: [clarify, live]
  should_require_revision: false
  notes: "well-trodden comparison, low difficulty control for the comparative category"

# ── multi_hop — the answer needs two facts joined, not one fact found. ──

- id: m1
  query: "What company created the transformer architecture, and what other major AI products has that company shipped since?"
  category: multi_hop
  expected_depth: [standard, deep]
  expected_min_sources: 5
  expected_agents_involved: [triage, planner, researcher, analyst, writer, critic]
  forbidden_agents: [clarify, live]
  should_require_revision: false
  notes: "requires chaining two facts across separate research tasks"

- id: m2
  query: "Which vector database does AMARIS use, and why was it chosen over alternatives?"
  category: multi_hop
  expected_depth: [standard, deep]
  expected_min_sources: 3
  expected_agents_involved: [triage, planner, researcher, writer, critic]
  forbidden_agents: [clarify, live]
  should_require_revision: false
  notes: "deliberately hard — this project's own ADR is not public web content, so the honest outcome is thin sources and a report that says so rather than one that invents an answer"

- id: m3
  query: "What is the relationship between LangChain, LangGraph, and LangSmith?"
  category: multi_hop
  expected_depth: [standard, deep]
  expected_min_sources: 5
  expected_agents_involved: [triage, planner, researcher, analyst, writer, critic]
  forbidden_agents: [clarify, live]
  should_require_revision: false
  notes: "three entities to connect correctly, tests whether the writer keeps them distinct"

# ── recent_events — does it actually search, or recite something stale it was trained on. ──

- id: r1
  query: "What AI models has Anthropic released most recently?"
  category: recent_events
  expected_depth: [brief, standard, deep]
  expected_min_sources: 4
  expected_agents_involved: [triage, planner, researcher, writer, critic]
  forbidden_agents: [clarify, live]
  should_require_revision: false
  notes: "deliberately hard — depends on live search finding events past the model's training data. Expect lower research_quality and treat that as correct. No reference_answer on purpose: any answer written here goes stale within weeks"

- id: r2
  query: "What is the latest stable version of the Python ragas evaluation library?"
  category: recent_events
  expected_depth: [direct, brief, standard]
  expected_min_sources: 3
  expected_agents_involved: [triage, planner, researcher, writer, critic]
  forbidden_agents: [clarify, live]
  should_require_revision: false
  notes: "deliberately hard — a fast-moving package version; tests whether the researcher searches rather than recalling a trained-in number"

# ── ambiguous — no correct answer exists, so the test is whether the critic pushes back. ──

- id: a1
  query: "Is Python better than JavaScript?"
  category: ambiguous
  expected_depth: [standard, deep]
  expected_min_sources: 4
  expected_agents_involved: [triage, planner, researcher, writer, critic]
  forbidden_agents: [clarify, live]
  should_require_revision: true
  notes: "deliberately hard — no factual answer exists; tests whether the critic sends back an overconfident one-sided report instead of approving it"

- id: a2
  query: "What's the best way to build AI agents?"
  category: ambiguous
  expected_depth: [standard, deep]
  expected_min_sources: 4
  expected_agents_involved: [triage, planner, researcher, writer, critic]
  forbidden_agents: [clarify, live]
  should_require_revision: true
  notes: "deliberately hard — vague scope could balloon into an unfocused plan; watch planner task quality and loop_efficiency"

- id: a3
  query: "Tell me about AI"
  category: ambiguous
  expected_depth: [brief, standard]
  expected_min_sources: 3
  expected_agents_involved: [triage, planner, researcher, writer, critic]
  forbidden_agents: [clarify, live]
  should_require_revision: false
  notes: "deliberately hard — almost no scope at all; tests whether the planner narrows it into concrete tasks or produces a shallow plan"

# ── clarification — a missing parameter no amount of searching can supply. Zero LLM research. ──

- id: x1
  query: "Is it worth it?"
  category: clarification
  expected_depth: []
  expected_min_sources: 0
  expected_agents_involved: [triage, clarify]
  forbidden_agents: [planner, researcher, analyst, writer, critic, live]
  should_require_revision: false
  notes: "no subject at all — triage must ask back and the run must stop there. clarify makes no model call of its own"

- id: x2
  query: "Which one should I pick for my project?"
  category: clarification
  expected_depth: []
  expected_min_sources: 0
  expected_agents_involved: [triage, clarify]
  forbidden_agents: [planner, researcher, analyst, writer, critic, live]
  should_require_revision: false
  notes: "replaces the old weather-with-no-location case, which now routes to live instead of clarify (ADR-041). A missing subject is still the cleanest clarification trigger"

# ── live — read from a data source, not researched (ADR-041). ──

- id: v1
  query: "What is the weather in Delhi right now?"
  category: live
  expected_depth: [direct]
  expected_min_sources: 1
  expected_agents_involved: [triage, live]
  forbidden_agents: [planner, researcher, analyst, clarify]
  should_require_revision: false
  notes: "the place is explicit, so triage short-circuits to Open-Meteo with zero model calls and the reading itself becomes the cited source"

- id: v2
  query: "How hot is it in Tokyo today?"
  category: live
  expected_depth: [direct]
  expected_min_sources: 1
  expected_agents_involved: [triage, live]
  forbidden_agents: [planner, researcher, analyst, clarify]
  should_require_revision: false
  notes: "phrased without the word 'weather' — tests that the live detector keys on the question, not on one keyword"
